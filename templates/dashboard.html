<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Semillero Digital</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Semillero Digital</a>
    <div class="d-flex">
      <a class="btn btn-outline-light" href="/logout">Cerrar sesión</a>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="mb-4">Dashboard de Cursos</h1>

  <!-- Filtros simples -->
  <form class="row mb-4" method="get">
    <div class="col-md-4">
      <label class="form-label">Filtrar por cohorte</label>
      <input type="text" class="form-control" name="cohort" value="{{ request.query_params.get('cohort','') }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Filtrar por profesor</label>
      <input type="text" class="form-control" name="teacher_email" value="{{ request.query_params.get('teacher_email','') }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Estado de entrega</label>
      <select class="form-select" name="status">
        <option value="">Todos</option>
        {% for s in ['entregado','atrasado','faltante','reentrega'] %}
          <option value="{{ s }}" {% if request.query_params.get('status') == s %}selected{% endif %}>{{ s|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12 mt-3">
      <button class="btn btn-primary">Aplicar filtros</button>
    </div>
  </form>

  <!-- Tabla de entregas -->
  <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-primary">
        <tr>
          <th>Curso</th>
          <th>Tarea</th>
          <th>Alumno</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        {% for row in data.rows %}
          <tr>
            <td>{{ row.cohort }}</td>
            <td>{{ row.courseWork }}</td>
            <td>{{ row.studentId }}</td>
            <td>
              <span class="badge bg-{{ 'success' if row.status=='entregado' else 'warning' if row.status=='atrasado' else 'danger' if row.status=='faltante' else 'info' }}">
                {{ row.status }}
              </span>
            </td>
          </tr>
        {% else %}
          <tr><td colspan="4" class="text-center">Sin datos para mostrar</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- Gráfico de progreso agregado -->
  <h2 class="mt-5">Progreso por alumno</h2>
  <canvas id="progressChart" height="120"></canvas>

</div>

<script>
const ctx = document.getElementById('progressChart');
const chartData = {
    labels: {{ data.progress_by_student.keys()|list|tojson }},
    datasets: [{
        label: 'Entregado',
        data: {{ [v.entregado for v in data.progress_by_student.values()]|tojson }},
        backgroundColor: '#28a745'
    },{
        label: 'Atrasado',
        data: {{ [v.atrasado for v in data.progress_by_student.values()]|tojson }},
        backgroundColor: '#ffc107'
    },{
        label: 'Faltante',
        data: {{ [v.faltante for v in data.progress_by_student.values()]|tojson }},
        backgroundColor: '#dc3545'
    },{
        label: 'Reentrega',
        data: {{ [v.reentrega for v in data.progress_by_student.values()]|tojson }},
        backgroundColor: '#17a2b8'
    }]
};

new Chart(ctx, {
    type: 'bar',
    data: chartData,
    options: {
        responsive: true,
        scales: {
            x: { stacked: true },
            y: { stacked: true, beginAtZero: true }
        }
    }
});
</script>

</body>
</html>
